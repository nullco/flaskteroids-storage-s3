name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    defaults:
      run:
        working-directory: flaskteroids-storage-s3
    steps:
      - uses: actions/checkout@v4
        with:
          path: flaskteroids-storage-s3
      - uses: actions/checkout@v4
        with:
          repository: nullco/flaskteroids
          path: flaskteroids
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
